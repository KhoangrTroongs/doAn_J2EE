services:
  mysql:
    image: mysql:8.4
    container_name: cakestore-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cakestore}
      MYSQL_USER: ${MYSQL_USER:-cakestore}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cakestore_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: cakestore-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:80" # Bạn sẽ truy cập qua port 8081
    environment:
      - PMA_HOST=mysql # Tên service của MySQL ở phía trên
      - PMA_PORT=3306
      - TZ=Asia/Ho_Chi_Minh

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cakestore-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-cakestore}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-cakestore}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-cakestore_password}
      CLIENT_ID: ${CLIENT_ID:-}
      CLIENT_SECRET: ${CLIENT_SECRET:-}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://demo-shop}
      VNP_TMNCODE: ${VNP_TMNCODE:-EC93RPTT}
      VNP_HASHSECRET: ${VNP_HASHSECRET:-V3UPNFSP4Y9SDQZJNK34SHFP7DHFG903}
      VNP_URL: ${VNP_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNP_RETURN_URL: ${VNP_RETURN_URL:-https://demo-api.honeysocial.click/checkout/result}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx768m}
    expose:
      - "8080"

  caddy:
    image: caddy:latest
    container_name: cakestore-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
