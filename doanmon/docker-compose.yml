services:
  mysql:
    image: mysql:8.4
    container_name: cakestore-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cakestore}
      MYSQL_USER: ${MYSQL_USER:-cakestore}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cakestore_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cakestore-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-cakestore}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-cakestore}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-cakestore_password}
      CLIENT_ID: ${CLIENT_ID:-}
      CLIENT_SECRET: ${CLIENT_SECRET:-}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://demo-shop}
      VNP_TMNCODE: ${VNP_TMNCODE:-EC93RPTT}
      VNP_HASHSECRET: ${VNP_HASHSECRET:-V3UPNFSP4Y9SDQZJNK34SHFP7DHFG903}
      VNP_URL: ${VNP_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNP_RETURN_URL: ${VNP_RETURN_URL:-https://demo-api.honeysocial.click/checkout/result}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx768m}
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: cakestore-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql_data:
